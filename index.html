<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Jabber — Real-Time Live Translation for Global Events</title>
    <meta name="description" content="Jabber delivers real-time AI transcription, translation, and voice synthesis to thousands of live event viewers — each in the language they choose. Serverless. Under 2-second latency. Free to start." />
    <meta name="keywords" content="real-time translation, live event translation, multilingual streaming, AI translation, live interpretation, OBS translation, RTMP translation, conference translation software, multilingual events, real-time transcription" />
    <meta name="author" content="Jabber" />
    <link rel="canonical" href="https://jabber.live/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jabber" />
    <meta property="og:title" content="Jabber — Real-Time Live Translation for Global Events" />
    <meta property="og:description" content="No interpreters. No hardware. Jabber translates your live stream into 10+ languages simultaneously with under 2-second latency. Free to start." />
    <meta property="og:url" content="https://jabber.live/" />
    <meta property="og:image" content="https://jabber.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@jabberlive" />
    <meta name="twitter:title" content="Jabber — Real-Time Live Translation for Global Events" />
    <meta name="twitter:description" content="No interpreters. No hardware. Jabber translates your live stream into 10+ languages simultaneously with under 2-second latency. Free to start." />
    <meta name="twitter:image" content="https://jabber.live/og-image.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Jabber",
      "url": "https://jabber.live",
      "logo": "https://jabber.live/logo.png",
      "description": "Jabber is a real-time AI translation platform for live events. It transcribes, translates, and delivers audio and captions in 10+ languages simultaneously with under 2-second latency.",
      "foundingDate": "2025",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://jabber.live/contact"
      }
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Jabber",
      "url": "https://jabber.live",
      "description": "Real-time live translation for global events. AI transcription, translation, and voice synthesis — serverless, under 2-second latency.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jabber.live/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Jabber",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "url": "https://jabber.live",
      "description": "Real-time AI translation SaaS for live events. Connects to any RTMP stream (OBS, vMix, hardware encoders) and delivers simultaneous translation in 10+ languages to unlimited viewers with under 2 seconds of end-to-end latency.",
      "offers": [
        {
          "@type": "Offer",
          "name": "Starter",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free plan: 100 concurrent viewers, 3 languages, 5 hours/month"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "299",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "299",
            "priceCurrency": "USD",
            "unitText": "month"
          },
          "description": "Pro plan: 5,000 concurrent viewers, 10+ languages, unlimited streaming, API access"
        }
      ],
      "featureList": [
        "Real-time AI speech transcription",
        "Simultaneous translation into 10+ languages",
        "Neural voice synthesis",
        "Under 2-second end-to-end latency",
        "OBS and RTMP stream compatibility",
        "WebSocket delivery to millions of viewers",
        "Auto scale to zero — $0 idle cost",
        "Per-viewer language selection",
        "REST and WebSocket API",
        "SOC 2 Type II infrastructure"
      ],
      "screenshot": "https://jabber.live/og-image.png"
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
